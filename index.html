function embedOf(u,snd){u=u||"";let m;
if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/))return{k:"f",p:"yt",id:m[1],vert:/\/shorts\//.test(u),src:"https://www.youtube.com/embed/"+m[1]+"?autoplay=1"+(snd?"":"&mute=1")+"&playsinline=1&rel=0&enablejsapi=1"};
if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))return{k:"f",p:"vm",id:m[1],src:"https://player.vimeo.com/video/"+m[1]+"?autoplay=1"+(snd?"":"&muted=1")};
if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return{k:"v",p:"mp4",src:u};return null}
const NOVID="<p>Tu pojawi się film. Wklej link (YouTube, Vimeo albo plik .mp4) w kodzie.</p>";
// miniaturka: własna (5. element wiersza) > YouTube > Vimeo (pobierana po załadowaniu) > pierwsza klatka pliku .mp4
function thumbHtml(i){const e=embedOf(i.u),pl="<span class='pl'>▶</span>";
if(i.u&&i.u!="#"&&!e)return "<a class='tm none' href='"+esc(i.u)+"' target='_blank' rel='noopener'><span>🔗</span>otwórz</a>";
if(!e||!i.u||i.u=="#")return "<div class='tm none'><span>🎞️</span>wkrótce</div>";
let im="";if(i.th)im="<img src='"+esc(i.th)+"' alt='' loading='lazy'>";
else if(e.p=="yt")im=ytThumbHtml(e.id);
else if(e.p=="vm")im="<img data-vm='"+e.id+"' alt=''>";
else if(e.p=="mp4")im="<video src='"+esc(e.src)+"#t=0.5' preload='metadata' muted playsinline></video>";
return "<button type='button' class='tm' data-play aria-label='Odtwórz: "+esc(i.t)+"'>"+im+pl+"</button>"}
function ytThumbHtml(id){return "<img src='https://i.ytimg.com/vi/"+id+"/maxresdefault.jpg' data-fallback='maxres' alt='' loading='lazy' onerror=\"if(this.dataset.fallback==='maxres'){this.dataset.fallback='sd';this.src='https://i.ytimg.com/vi/"+id+"/sddefault.jpg'}else if(this.dataset.fallback==='sd'){this.dataset.fallback='hq';this.src='https://i.ytimg.com/vi/"+id+"/hqdefault.jpg'}else{this.style.display='none'}\">"}
function loadVimeoThumbs(root){root.querySelectorAll("img[data-vm]").forEach(im=>{const id=im.dataset.vm;try{fetch("https://vimeo.com/api/oembed.json?url="+encodeURIComponent("https://vimeo.com/"+id)).then(r=>r.json()).then(j=>{if(j&&j.thumbnail_url)im.src=j.thumbnail_url}).catch(()=>{})}catch(x){}})}
function posterOf(e,th){if(th)return "<img src='"+esc(th)+"' alt=''>";if(e.p=="yt")return ytThumbHtml(e.id);if(e.p=="vm")return "<img data-vm='"+e.id+"' alt=''>";return ""}
function ico(f,s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true"><path fill="#000" d="M2 6h12l2 3h14v19H2z"/><path fill="'+f.c[0]+'" d="M3 7h10l2 3h14v17H3z"/><path fill="'+f.c[1]+'" d="M3 12h26v15H3z"/><path fill="'+f.c[2]+'" d="M3 12h26v1H3zM3 12h1v15H3z"/><path fill="'+f.c[3]+'" d="M3 26h26v1H3zM28 12h1v15h-1z"/><g transform="translate(-2 0)">'+GLYPHS[f.g]+'</g></svg>'}
function front(w){w.style.zIndex=++z}

// adres strony zapamiętuje otwarty folder / film (np. #tele/arkada-alkoflow), więc można wysłać komuś link do konkretnej pracy
function setHash(x){try{history.replaceState(null,"",x?"#"+x:location.pathname+location.search)}catch(e){}}
function findVideo(items,s){for(const i of items){if(i.sub){const r=findVideo(i.sub,s);if(r)return r}else if(slug(i.t)==s)return i}return null}
function openFromHash(){let h="";try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}if(!h)return false;
const p=h.split("/"),f=F.find(x=>x.id==p[0]);if(!f)return false;
openW(f);if(p[1]&&f.items){const it=findVideo(f.items,p[1]);if(it)openPlayer(it.t,it.u,f,it.th)}return true}

// wspólne okno (pasek tytułu, minimalizacja, zamykanie, przeciąganie, przycisk na pasku zadań)
function makeWindow(o){
const w=document.createElement("div");w.className="win raised"+(o.cls?" "+o.cls:"");w.id=o.id;
w.innerHTML="<div class='th'><span>"+ico(o.f,16)+"<span class='tt'>"+esc(o.title)+"</span></span><span><button class='raised mn' aria-label='Minimalizuj'>_</button><button class='raised cl' aria-label='Zamknij'>✕</button></span></div>"+o.body;
document.body.appendChild(w);front(w);
const tk=document.createElement("button");tk.className="raised";tk.title=o.title;tk.innerHTML=ico(o.f,16)+"<span class='tl'>"+esc(o.title)+"</span>";$("#tasks").appendChild(tk);
const hide=()=>{w.style.display="none";o.onHide&&o.onHide();updateMotion()};
const show=()=>{w.style.display="block";front(w);o.onShow&&o.onShow();updateMotion()};
tk.onclick=()=>w.style.display=="none"?show():hide();
w.querySelector(".cl").onclick=()=>{w.remove();tk.remove();updateMotion()};
w.querySelector(".mn").onclick=hide;
w.onpointerdown=()=>front(w);
const h=w.querySelector(".th");
h.onpointerdown=e=>{if(e.target.closest("button"))return;const dx=e.clientX-w.offsetLeft,dy=e.clientY-w.offsetTop;h.setPointerCapture(e.pointerId);
h.onpointermove=m=>{w.style.left=Math.min(innerWidth-60,Math.max(60-w.offsetWidth,m.clientX-dx))+"px";w.style.top=Math.min(innerHeight-60,Math.max(0,m.clientY-dy))+"px"};
const stop=()=>{h.onpointermove=null};h.onpointerup=stop;h.onpointercancel=stop};
return w}

// pauza / wznowienie filmu po minimalizacji okna
function sendEmbed(w,cmd){const m=w.querySelector(".vm");if(!m)return;
if(m.tagName=="VIDEO"){cmd=="pause"?m.pause():m.play().catch(()=>{});return}
const yt=/youtube/.test(m.src||"");
const msg=yt?JSON.stringify({event:"command",func:cmd=="pause"?"pauseVideo":"playVideo",args:[]}):JSON.stringify({method:cmd});
try{m.contentWindow.postMessage(msg,"*")}catch(x){}}

function openPlayer(t,u,f,th){f=f||F[1]||F[0];const e=embedOf(u,true);
if(!e)return openW({id:"p-"+hid(t+"|"+u),name:t,c:f.c,g:"play",html:NOVID,wide:true});
const wid="w-v"+hid(t+"|"+u),ex=document.getElementById(wid);
if(ex){ex.style.display="block";front(ex);sendEmbed(ex,"play");updateMotion();return}
const availH=innerHeight-30-28-64-24;
// Shorty (pion 9:16) dostają wąskie, wysokie okno
const WD=e.vert?Math.max(240,Math.min(innerWidth-16,availH*9/16,420)):Math.max(260,Math.min(760,innerWidth-16,availH*16/9));
const file=e.p=="yt"&&(location.protocol=="file:"||location.origin=="null"||!/^https?:$/.test(location.protocol));
const where=e.p=="yt"?"na YouTube":e.p=="vm"?"na Vimeo":"w nowej karcie";
const body="<div class='wb vb sunken'><div class='stage"+(e.vert?" vert":"")+"'><div class='poster'>"+posterOf(e,th)+"<span class='pl'>▶</span><small>uruchamianie filmu…</small></div></div><p class='vn'><a href='"+esc(u)+"' target='_blank' rel='noopener'>Otwórz film "+where+" ►</a>"+(file?"<br>Ten plik został otwarty jako file://. Do odtwarzania użyj Uruchom_Portfolio.command z folderu Pobrane — otworzy stronę przez localhost.":"")+"</p></div>";
const w=makeWindow({id:wid,title:t,f,cls:"vwin",body,onHide:()=>sendEmbed(w,"pause"),onShow:()=>sendEmbed(w,"play")});
w.style.width=WD+"px";loadVimeoThumbs(w);
w.style.left=Math.max(8,(innerWidth-w.offsetWidth)/2)+"px";w.style.top=Math.max(8,(innerHeight-30-w.offsetHeight)/2)+"px";
if(F.includes(f))setHash(f.id+(f.play?"":"/"+slug(t)));
updateMotion();
const st=w.querySelector(".stage"),po=w.querySelector(".poster"),t0=Date.now();let done=false;
const reveal=()=>{if(done)return;done=true;po.classList.add("gone")};
const soon=()=>setTimeout(reveal,Math.max(0,1000-(Date.now()-t0)));
// Wstaw odtwarzacz bez opóźnienia po kliknięciu, aby przeglądarka dopuściła autoplay.
const m=document.createElement(e.k=="f"?"iframe":"video");m.className="vm";
if(e.k=="f"){m.title="Odtwarzacz: "+t;m.setAttribute("allow","autoplay; fullscreen; picture-in-picture; encrypted-media");m.setAttribute("referrerpolicy","strict-origin-when-cross-origin");m.setAttribute("allowfullscreen","");m.addEventListener("load",soon);m.src=e.src}
else{m.setAttribute("aria-label","Odtwarzacz: "+t);m.controls=true;m.autoplay=true;m.playsInline=true;m.addEventListener("loadeddata",soon);m.src=e.src}
st.insertBefore(m,po);setTimeout(reveal,7000)}

loadVimeoThumbs(w);
w.querySelectorAll(".sub").forEach(r=>r.onclick=()=>{const it=f.items[r.dataset.k];openW({id:f.id+"-"+r.dataset.k,name:it.t,c:f.c,g:f.g,items:it.sub})});

// maskotka 3D (three.js) + strzałka 3D
const mas=$("#mas"),arr=$("#arr"),arrFallback=$("#arr-fallback"),bub=$(".bub");
function scene3D(cv,w,h,fov,camZ,build,tick,px){px=px||1;if(typeof THREE=="undefined")return null;
const r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:px==1});r.setPixelRatio(px>1?1:Math.min(devicePixelRatio,2));r.setSize(w/px,h/px,false);cv.style.width=w+"px";cv.style.height=h+"px";if(px>1)cv.style.imageRendering="pixelated";
const sc=new THREE.Scene(),c=new THREE.PerspectiveCamera(fov,w/h,.1,50);c.position.set(0,0,camZ);
sc.add(new THREE.AmbientLight(0xffffff,.5));const d=new THREE.DirectionalLight(0xffffff,1.25);d.position.set(4,3,3);sc.add(d);
const g=build();sc.add(g);return t=>{tick(g,t);r.render(sc,c)}}
let bt0=-1e9,resting=true,turnNow=TURN_DEG;
let dog=null,arw=null;mas.classList.add("fallback");
function init3D(){if(typeof THREE=="undefined"){mas.classList.add("fallback");return;}mas.classList.remove("fallback");dog=scene3D($("#dogc"),110,130,35,6.4,()=>{const g=new THREE.Group(),b=new THREE.Group(),Y=new THREE.MeshStandardMaterial({color:0xffd400,roughness:.3}),D=new THREE.MeshStandardMaterial({color:0x222222,roughness:.4});
b.add(new THREE.Mesh(new THREE.SphereGeometry(1,32,24),Y));
[-1,1].forEach(k=>{const e=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),D);e.scale.set(.11,.2,.08);e.position.set(k*.35,.3,.88);b.add(e)});
const mo=new THREE.Mesh(new THREE.TorusGeometry(.5,.07,8,24,Math.PI),D);mo.rotation.z=Math.PI;mo.position.set(0,.05,.88);b.add(mo);
const sh=new THREE.Mesh(new THREE.CircleGeometry(.9,24),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.3}));sh.rotation.x=-Math.PI/2;sh.position.y=-1.5;
g.add(b,sh);g.userData={b,sh};return g},
(g,t)=>{const u=g.userData,b=u.b,sh=u.sh,e=(t-bt0)/BOUNCE_MS;resting=e>=BOUNCES;const p=resting?0:e%1,h=resting?0:4*p*(1-p)*1.2,
sy=resting?(e-BOUNCES<.25?.7+.3*(e-BOUNCES)/.25:1):(h<.12?.7+.3*h/.12:1);
b.scale.set(1/Math.sqrt(sy),sy,1/Math.sqrt(sy));b.position.y=-1.5+sy+h;
if(turnNow>=360){const a=Math.min(1,Math.max(0,(p-.05)/.9));u.r=resting?0:2*Math.PI*a*a*(3-2*a)}
else u.r=(u.r||0)+((resting?0:Math.sin(e*2*Math.PI/BOUNCES)*turnNow*Math.PI/360)-(u.r||0))*.12;
b.rotation[TURN_AXIS]=u.r;
sh.scale.setScalar(1-.3*h/1.2);sh.material.opacity=.3*(1-.5*h/1.2)},PIXEL);
arw=scene3D(arr,44,60,35,4.4,()=>{const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0xee2222,roughness:.35,metalness:.2});
const a=new THREE.Mesh(new THREE.BoxGeometry(.55,1.1,.4),m);a.position.y=-.5;const h=new THREE.Mesh(new THREE.ConeGeometry(.85,.95,4),m);h.rotation.y=Math.PI/4;h.position.y=.5;g.add(a,h);g.rotation.x=.2;return g},(g,t)=>{g.rotation.y=t/600})}
(function loop(t){requestAnimationFrame(loop);if(mas.style.display=="flex"){dog&&dog(t);arw&&arw(t)}})(0);
(function(){const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";sc.async=true;sc.onload=init3D;sc.onerror=()=>mas.classList.add("fallback");document.head.appendChild(sc)})();
// buźkę można przeciągać; nie rusza się, dopóki w nią nie klikniesz
const dc=$("#dogc");mas.addEventListener("click",()=>{if(mas.classList.contains("fallback")&&resting&&!REDUCED){bt0=performance.now();turnNow=TURN_CLICK_DEG}});dc.title="Kliknij mnie, a podskoczę. Możesz mnie też przeciągnąć";dc.style.touchAction="none";let dr=null;
dc.onpointerdown=e=>{dc.setPointerCapture(e.pointerId);dr={x:e.clientX,y:e.clientY,l:mas.offsetLeft,t:mas.offsetTop,m:false}};
dc.onpointermove=e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;if(Math.abs(dx)+Math.abs(dy)>5)dr.m=true;if(dr.m){mas.style.left=Math.max(0,Math.min(innerWidth-mas.offsetWidth,dr.l+dx))+"px";mas.style.top=Math.max(0,Math.min(innerHeight-mas.offsetHeight-30,dr.t+dy))+"px"}};
dc.onpointerup=()=>{if(dr&&!dr.m&&resting&&!REDUCED){bt0=performance.now();turnNow=TURN_CLICK_DEG}dr=null};
dc.onpointercancel=()=>{dr=null};
function point(el,txt,sec){const r=el.getBoundingClientRect();mascotParked=false;bt0=-1e9;resting=true;turnNow=sec?TURN_CLICK_DEG:TURN_DEG;bub.textContent=txt;bub.style.display="block";mas.style.right="auto";mas.style.bottom="auto";mas.style.display="flex";arr.style.display="block";arrFallback.textContent=sec?"➜":"⬆";arrFallback.style.display=mas.classList.contains("fallback")?"block":"none";
mas.classList.toggle("stack",!!sec);arr.classList.toggle("side",!!sec);
if(!sec){arr.style.left=r.left+r.width/2-22+"px";arr.style.top=r.bottom+2+"px";arrFallback.style.left=arr.style.left;arrFallback.style.top=arr.style.top;
mas.style.left=Math.min(innerWidth-mas.offsetWidth-8,Math.max(8,r.left+r.width/2-50))+"px";
mas.style.top=Math.min(innerHeight-mas.offsetHeight-40,r.bottom+66)+"px";return}
const cy=r.top+36,cx=r.right+38;
arr.style.setProperty("--rot","-90deg");arr.style.left=cx-22+"px";arr.style.top=cy-30+"px";arrFallback.style.left=arr.style.left;arrFallback.style.top=arr.style.top;
mas.style.left=Math.max(4,Math.min(innerWidth-mas.offsetWidth-4,cx+36))+"px";
mas.style.top=Math.max(8,Math.min(innerHeight-mas.offsetHeight-40,cy-mas.offsetHeight+65))+"px"}
function hideMas(){mas.style.display=arr.style.display=arrFallback.style.display="none"}
function parkMascot(){mascotParked=true;arr.style.display=arrFallback.style.display="none";mas.classList.add("stack");mas.style.left="auto";mas.style.top="auto";mas.style.right="10px";mas.style.bottom="calc(40px + env(safe-area-inset-bottom,0px))";mas.style.display="flex";bub.style.display="block";bub.textContent="Miłego oglądania!";setTimeout(()=>{if(!guideWaiting)bub.style.display="none"},3600)}
